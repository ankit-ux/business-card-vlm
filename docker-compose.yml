services:
  backend:
    build: ./backend
    container_name: bcard-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: bcard-frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: bcard-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
